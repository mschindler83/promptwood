[project]
name = "video-chain"
version = "0.1.0"
description = "Chain MiniMax-H3 image-to-video clips: each prompt continues from the last frame of the clip before"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "websocket-client>=1.7"]

[project.optional-dependencies]
dev = ["pytest", "pillow", "numpy", "safetensors"]

[project.gui-scripts]
video-chain-gui = "video_chain.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_chain = ["theme/*.json", "theme/*.in", "theme/icons/*.svg", "theme/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
