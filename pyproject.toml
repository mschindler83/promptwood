[project]
name = "video-chain"
version = "0.1.0"
description = "Chain MiniMax-H3 image-to-video clips: each prompt continues from the last frame of the clip before"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "websocket-client>=1.7",
    "pyyaml>=6",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "pytest-xdist", "pillow", "numpy", "safetensors", "mypy"]
# "Crop to face" for face pictures: insightface's SCRFD detector (from ComfyUI's models folder) on the CPU
faces = ["onnxruntime>=1.18", "numpy"]

[project.gui-scripts]
video-chain-gui = "video_chain.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_chain = ["theme/*.json", "theme/*.in", "theme/icons/*.svg", "theme/fonts/*", "cloud/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["models: needs real model files (run with -m models)",
           "slow: takes more than about 5 s (real ffmpeg media); skip with -m 'not slow'",
           "h3_default: new trees get the app's real default prompt format (h3), not the tests' classic one"]
# every run in parallel (32 cores: the ffmpeg-heavy suite takes minutes in one process); one test stops after 60 s
# (thread method: also when stuck inside Qt or a subprocess), a whole run after 300 s (tests/run_limits.py)
addopts = "-m 'not models' -n 16 --dist load -p run_limits"
timeout = 60
timeout_method = "thread"
faulthandler_timeout = 50

[tool.mypy]
python_version = "3.12"
files = ["src/video_chain", "comfy_nodes"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

